<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENIGMA - Narrativa Profunda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Crimson Pro', serif; background-color: #0B0E14; color: #E5E7EB; line-height: 1.8; }
        .gold-text { color: #C9A063; }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(201, 160, 99, 0.2); }
        .choice-btn { border: 1px solid rgba(201, 160, 99, 0.4); transition: all 0.3s ease; }
        .choice-btn:hover { background: rgba(201, 160, 99, 0.1); border-color: #C9A063; transform: translateX(5px); }
        p { margin-bottom: 1.5rem; font-size: 1.25rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
    <!-- BARRA DE PROGRESO Y STATS -->
    <nav class="w-full max-w-3xl flex justify-between items-center p-6 sticky top-0 z-50 bg-[#0B0E14]/90">
        <div class="flex flex-col">
            <span class="text-xs uppercase tracking-widest gold-text font-bold">Aventura: Luz y el Circo</span>
            <div id="valor-hearts" class="flex gap-1 text-xl"></div>
        </div>
        <div id="mochila" class="flex gap-2"></div>
    </nav>

    <main id="game-container" class="max-w-3xl w-full p-6 pb-24">
        <div id="escena-container" class="glass-panel p-8 md:p-12 rounded-3xl shadow-2xl mb-8">
            <h2 id="escena-titulo" class="text-3xl md:text-4xl font-bold gold-text mb-8 border-b border-gold/20 pb-4"></h2>
            <div id="escena-texto" class="space-y-4 italic text-gray-200">
                <!-- El texto largo de la IA aparecerá aquí -->
            </div>
        </div>

        <div id="opciones" class="space-y-4">
            <!-- Múltiples decisiones aquí -->
        </div>
    </main>

    <script>
        const URL_PROYECTO = 'https://wsaxismjuiyvapdknjoi.supabase.co'; 
        const KEY_PROYECTO = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYXhpc21qdWl5dmFwZGtuam9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQxODMsImV4cCI6MjEwMjQ2MDE4M30.athADmclWSEjUDCPZX2agiUgEDiEzKZipal24BbQs50';
        const { createClient } = supabase;
        const enigma = createClient(URL_PROYECTO, KEY_PROYECTO);

        let estado = { valor: 3, inventario: [] };

        async function cargarEscena(id) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            const { data: escena } = await enigma.from('escenas').select('*').eq('id', id).single();
            const { data: decisiones } = await enigma.from('decisiones').select('*').eq('escena_origen_id', id);

            if (!escena) return;

            // Renderizar texto con saltos de línea (párrafos)
            document.getElementById('escena-titulo').innerText = escena.titulo_escena;
            const textoHTML = escena.texto_narrativo.split('\n').map(p => `<p>${p}</p>`).join('');
            document.getElementById('escena-texto').innerHTML = textoHTML;

            const contenedor = document.getElementById('opciones');
            contenedor.innerHTML = '';

            decisiones.forEach(opc => {
                const b = document.createElement('button');
                b.className = "w-full p-6 glass-panel rounded-2xl text-left choice-btn flex items-center gap-4 group";
                b.innerHTML = `
                    <div class="w-2 h-2 rounded-full bg-[#C9A063] group-hover:scale-150 transition"></div>
                    <span class="text-lg font-bold">${opc.texto_boton}</span>
                `;
                b.onclick = () => cargarEscena(opc.escena_destino_id);
                contenedor.appendChild(b);
            });

            actualizarInterfaz();
        }

        function actualizarInterfaz() {
            document.getElementById('valor-hearts').innerText = "❤️".repeat(estado.valor);
        }

        window.onload = () => cargarEscena(1);
    </script>
</body>
</html>
