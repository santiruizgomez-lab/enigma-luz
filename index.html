<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ENIGMA ENGINE v7.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0B0E14; color: #E5E7EB; font-family: serif; }
        .gold { color: #C9A063; }
        .panel { background: rgba(31, 41, 55, 0.5); border: 1px solid #C9A063; border-radius: 20px; padding: 2rem; }
        .btn { width: 100%; padding: 1rem; margin-top: 1rem; border: 1px solid #C9A063; border-radius: 10px; text-align: left; transition: 0.3s; }
        .btn:hover { background: rgba(201, 160, 99, 0.1); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body class="p-4 flex flex-col items-center">
    <nav class="w-full max-w-2xl flex justify-between py-4 border-b border-gray-800 mb-8">
        <h1 class="text-2xl gold font-bold">ENIGMA</h1>
        <button onclick="reiniciar()" class="text-xs gray-500 uppercase">Reset</button>
    </nav>

    <main class="w-full max-w-2xl">
        <div id="status" class="text-[10px] gold uppercase mb-4">Cargando motor...</div>
        
        <div id="game-card" class="panel">
            <div id="img-cont" class="hidden mb-4 rounded-lg overflow-hidden">
                <img id="sc-img" src="" class="w-full h-48 object-cover">
            </div>
            <h2 id="sc-titulo" class="text-2xl font-bold gold mb-4 text-center">Iniciando...</h2>
            <p id="sc-texto" class="text-lg italic mb-6"></p>
            <div id="sc-opciones"></div>
        </div>

        <div id="error-log" class="hidden mt-8 p-4 bg-red-900/20 border border-red-500 text-red-500 text-xs rounded-lg">
            <strong>Error Detectado:</strong> <span id="error-msg"></span>
        </div>
    </main>

    <script>
        const URL = 'https://wsaxismjuiyvapdknjoi.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYXhpc21qdWl5dmFwZGtuam9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQxODMsImV4cCI6MjEwMjQ2MDE4M30.athADmclWSEjUDCPZX2agiUgEDiEzKZipal24BbQs50';
        
        let sb;
        let save = JSON.parse(localStorage.getItem('enigma_save')) || { id: 1, items: [] };

        window.onload = async () => {
            try {
                sb = supabase.createClient(URL, KEY);
                await cargar(save.id);
            } catch (e) {
                panic(e.message);
            }
        };

        async function cargar(id) {
            document.getElementById('status').innerText = "Conectando con Supabase...";
            
            const { data: esc, error: err1 } = await sb.from('escenas').select('*').eq('id', id).single();
            const { data: decs, error: err2 } = await sb.from('decisiones').select('*').eq('escena_origen_id', id);

            if (err1 || !esc) return panic("No encuentro la escena " + id + ". Pulsa Reset.");

            // UI
            document.getElementById('sc-titulo').innerText = esc.titulo_escena;
            document.getElementById('sc-texto').innerText = esc.texto_narrativo;
            
            if (esc.imagen_url) {
                document.getElementById('sc-img').src = esc.imagen_url;
                document.getElementById('img-cont').classList.remove('hidden');
            } else {
                document.getElementById('img-cont').classList.add('hidden');
            }

            const optDiv = document.getElementById('sc-opciones');
            optDiv.innerHTML = '';

            if (decs) {
                decs.forEach(d => {
                    const b = document.createElement('button');
                    b.className = "btn";
                    const bloqueado = d.item_requerido && !save.items.includes(d.item_requerido);
                    
                    b.innerHTML = bloqueado ? `🔒 ${d.texto_boton} (Falta ${d.item_requerido})` : d.texto_boton;
                    b.disabled = bloqueado;
                    
                    b.onclick = () => {
                        if (d.item_entregado && !save.items.includes(d.item_entregado)) {
                            save.items.push(d.item_entregado);
                        }
                        save.id = d.escena_destino_id;
                        localStorage.setItem('enigma_save', JSON.stringify(save));
                        cargar(d.escena_destino_id);
                    };
                    optDiv.appendChild(b);
                });
            }
            
            document.getElementById('status').innerText = "Mochila: " + (save.items.join(', ') || "Vacía");
        }

        function panic(m) {
            document.getElementById('error-log').classList.remove('hidden');
            document.getElementById('error-msg').innerText = m;
            document.getElementById('status').innerText = "ERROR";
        }

        function reiniciar() {
            localStorage.removeItem('enigma_save');
            location.reload();
        }
    </script>
</body>
</html>
