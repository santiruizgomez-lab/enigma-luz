<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENIGMA - Luz y el Circo de los Sueños</title>
    <!-- Cargamos las herramientas: Tailwind para el diseño y Supabase para los datos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Crimson Pro', serif; background-color: #0B0E14; color: #F8F9FA; }
        .gold-border { border-color: #C9A063; }
        .gold-text { color: #C9A063; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <div id="game-container" class="max-w-2xl w-full mt-10 space-y-8">
        <h1 class="text-center text-4xl gold-text font-bold tracking-widest">ENIGMA</h1>
        
        <div id="pantalla-carga" class="bg-gray-900/50 p-8 rounded-2xl border gold-border text-center">
            <p class="text-xl animate-pulse">Cargando aventura...</p>
        </div>

        <div id="pantalla-juego" class="hidden space-y-8">
            <div class="bg-gray-900/50 p-8 rounded-2xl border gold-border shadow-2xl">
                <h2 id="escena-titulo" class="text-2xl mb-4 gold-text font-bold"></h2>
                <p id="escena-texto" class="text-xl leading-relaxed italic text-gray-300"></p>
            </div>
            <div id="opciones" class="grid grid-cols-1 gap-4"></div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN (Pon tus datos aquí)
        const URL_PROYECTO = 'https://wsaxismjuiyvapdknjoi.supabase.co/rest/v1/'; 
        const KEY_PROYECTO = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYXhpc21qdWl5dmFwZGtuam9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQxODMsImV4cCI6MjEwMjQ2MDE4M30.athADmclWSEjUDCPZX2agiUgEDiEzKZipal24BbQs50';

        // Iniciamos la conexión con cuidado
        const { createClient } = supabase;
        const clienteEnigma = createClient(URL_PROYECTO, KEY_PROYECTO);

        async function cargarEscena(id) {
            console.log("Intentando cargar escena:", id);
            
            // 1. Buscamos la escena en la base de datos
            const { data: escena, error: errorEscena } = await clienteEnigma
                .from('escenas')
                .select('*')
                .eq('id', id)
                .single();

            if (errorEscena) {
                console.error("Error de Supabase:", errorEscena);
                alert("Error al conectar. Revisa las Policies en Supabase.");
                return;
            }

            // Mostramos la interfaz de juego
            document.getElementById('pantalla-carga').classList.add('hidden');
            document.getElementById('pantalla-juego').classList.remove('hidden');

            // Ponemos el texto
            document.getElementById('escena-titulo').innerText = escena.titulo_escena;
            document.getElementById('escena-texto').innerText = escena.texto_narrativo;

            // 2. Buscamos los botones para esa escena
            const { data: decisiones } = await clienteEnigma
                .from('decisiones')
                .select('*')
                .eq('escena_origen_id', id);

            const contenedorOpciones = document.getElementById('opciones');
            contenedorOpciones.innerHTML = '';

            if (decisiones) {
                decisiones.forEach(opcion => {
                    const boton = document.createElement('button');
                    boton.className = "w-full p-4 border gold-border bg-gray-800/50 hover:bg-yellow-900/20 rounded-xl text-left transition gold-text font-bold";
                    boton.innerText = opcion.texto_boton;
                    boton.onclick = () => cargarEscena(opcion.escena_destino_id);
                    contenedorOpciones.appendChild(boton);
                });
            }
        }

        // Arrancamos la aventura
        window.onload = () => cargarEscena(1);
    </script>
</body>
</html>
