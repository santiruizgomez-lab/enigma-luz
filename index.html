<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ENIGMA - THE FINAL VERSION</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#05070a] text-gray-200 p-6 font-serif flex flex-col items-center min-h-screen">
    <nav class="w-full max-w-2xl flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <h1 class="text-3xl font-bold text-[#C9A063] italic">ENIGMA</h1>
        <button onclick="localStorage.clear(); location.reload();" class="text-xs uppercase text-gray-500">Reset</button>
    </nav>

    <main class="w-full max-w-2xl space-y-6">
        <div id="status" class="text-[10px] text-[#C9A063] uppercase tracking-widest px-2"></div>
        <div class="bg-gray-900/50 border-2 border-yellow-600/20 p-8 rounded-[2rem] shadow-2xl">
            <div id="img-cont" class="hidden mb-6 rounded-2xl overflow-hidden border border-gold/10">
                <img id="sc-img" src="" class="w-full h-auto object-cover max-h-[400px]">
            </div>
            <h2 id="sc-titulo" class="text-3xl font-bold text-[#C9A063] mb-4">Cargando...</h2>
            <p id="sc-texto" class="text-xl italic text-gray-300 mb-8 leading-relaxed"></p>
            <div id="sc-opciones" class="space-y-3"></div>
        </div>
        <textarea id="notas" oninput="saveNotes()" class="w-full h-32 bg-black/40 border border-gray-800 p-4 rounded-xl text-sm outline-none focus:border-[#C9A063]" placeholder="Escribe tus notas aquí..."></textarea>
    </main>

    <script>
        const URL = 'https://wsaxismjuiyvapdknjoi.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYXhpc21qdWl5dmFwZGtuam9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQxODMsImV4cCI6MjEwMjQ2MDE4M30.athADmclWSEjUDCPZX2agiUgEDiEzKZipal24BbQs50';
        const sb = supabase.createClient(URL, KEY);

        let save = JSON.parse(localStorage.getItem('enigma_vFinal')) || { id: 1, items: [], hp: 3, notes: "" };

        async function engine(id) {
            save.id = id;
            localStorage.setItem('enigma_vFinal', JSON.stringify(save));
            const { data: esc } = await sb.from('escenas').select('*').eq('id', id).single();
            const { data: decs } = await sb.from('decisiones').select('*').eq('escena_origen_id', id);

            if(!esc) return;
            document.getElementById('sc-titulo').innerText = esc.titulo_escena;
            document.getElementById('sc-texto').innerText = esc.texto_narrativo;
            if(esc.imagen_url) { document.getElementById('sc-img').src = esc.imagen_url; document.getElementById('img-cont').classList.remove('hidden'); }
            else { document.getElementById('img-cont').classList.add('hidden'); }

            const div = document.getElementById('sc-opciones');
            div.innerHTML = '';
            decs.forEach(d => {
                const b = document.createElement('button');
                b.className = "w-full p-4 border border-yellow-600/30 rounded-xl text-left hover:bg-yellow-600/10 transition";
                const lock = d.item_requerido && !save.items.includes(d.item_requerido);
                b.innerHTML = lock ? `🔒 ${d.texto_boton}` : d.texto_boton;
                b.disabled = lock;
                b.onclick = () => {
                    if(d.respuesta_secreta) {
                        const res = prompt("Introduce el secreto:").toLowerCase().trim();
                        if(res !== d.respuesta_secreta) { alert("Error crítico..."); save.hp--; updateUI(); return; }
                    }
                    if(d.item_entregado && !save.items.includes(d.item_entregado)) save.items.push(d.item_entregado);
                    engine(d.escena_destino_id);
                };
                div.appendChild(b);
            });
            updateUI();
        }

        function updateUI() {
            document.getElementById('status').innerText = "Vidas: " + "❤️".repeat(Math.max(0, save.hp)) + " | Mochila: " + (save.items.length || "Vacía");
            if(save.hp <= 0) { alert("Game Over"); localStorage.clear(); location.reload(); }
        }
        function saveNotes() { save.notes = document.getElementById('notas').value; localStorage.setItem('enigma_vFinal', JSON.stringify(save)); }
        window.onload = () => { document.getElementById('notas').value = save.notes; engine(save.id); };
    </script>
</body>
</html>
