<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ENIGMA: El Bosque de los Espejos Rotos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #05070a; color: #d1d5db; font-family: 'Crimson Pro', serif; overflow-x: hidden; }
        .gold { color: #C9A063; }
        .glass { background: rgba(15, 20, 25, 0.9); border: 1px solid rgba(201, 160, 99, 0.2); backdrop-filter: blur(15px); }
        .btn { width: 100%; padding: 1.2rem; border: 1px solid rgba(201, 160, 99, 0.3); border-radius: 12px; text-align: left; transition: 0.3s; background: rgba(255,255,255,0.02); margin-bottom: 0.8rem; font-weight: bold; }
        .btn:hover:not(:disabled) { border-color: #C9A063; background: rgba(201, 160, 99, 0.1); transform: translateX(8px); }
        .btn:disabled { opacity: 0.15; cursor: not-allowed; }
        .sidebar { position: fixed; right: 0; top: 0; height: 100%; width: 350px; transform: translateX(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; border-left: 1px solid rgba(201, 160, 99, 0.2); }
        .sidebar.open { transform: translateX(0); }
        .inventory-slot { padding: 10px; border: 1px solid rgba(201, 160, 99, 0.1); border-radius: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #C9A063; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">
    <!-- UI SUPERIOR -->
    <nav class="w-full max-w-6xl flex justify-between items-center mb-8 border-b border-gray-800 pb-6">
        <h1 class="text-4xl gold font-bold italic tracking-tighter">ENIGMA</h1>
        <div class="flex items-center gap-6">
            <div id="hearts" class="text-2xl"></div>
            <button onclick="document.getElementById('diary').classList.toggle('open')" class="px-6 py-2 glass gold rounded-full text-xs uppercase font-bold border-gold hover:bg-gold/10 transition">📔 Abrir Diario</button>
            <button onclick="resetGame()" class="text-[10px] text-gray-600 hover:text-red-500 uppercase font-bold">Reset</button>
        </div>
    </nav>

    <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-5 gap-10">
        <!-- MOCHILA (VISIBLE SIEMPRE EN ESCRITORIO) -->
        <aside class="hidden lg:block lg:col-span-1 space-y-6">
            <div class="glass p-6 rounded-3xl">
                <h3 class="text-xs uppercase gold font-bold tracking-[0.3em] mb-4 text-center">Mochila</h3>
                <div id="inv-list" class="space-y-3"></div>
            </div>
            <div class="p-4 text-[11px] text-gray-600 italic leading-relaxed">
                Usa el diario para anotar los acertijos de Ónice y la Esfinge. Sin notas, no sobrevivirás al Rey Sombra.
            </div>
        </aside>

        <!-- ESCENA PRINCIPAL -->
        <section class="lg:col-span-4">
            <div class="glass p-8 md:p-14 rounded-[3rem] shadow-2xl border-2 relative">
                <div id="img-cont" class="hidden mb-10 rounded-[2rem] overflow-hidden border border-gold/20 shadow-2xl">
                    <img id="sc-img" src="" class="w-full h-auto object-cover max-h-[500px]">
                </div>
                <h2 id="sc-titulo" class="text-3xl md:text-5xl font-bold gold mb-8 tracking-tight border-b border-gold/10 pb-4"></h2>
                <div id="sc-texto" class="text-xl md:text-2xl leading-relaxed text-gray-300 italic mb-12"></div>
                <div id="sc-opciones" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </section>
    </main>

    <!-- DIARIO LATERAL -->
    <div id="diary" class="sidebar glass p-10 shadow-2xl">
        <h3 class="gold font-bold uppercase mb-6 tracking-widest text-center">Grimorio de Luz</h3>
        <p class="text-[10px] text-gray-500 mb-4 text-center uppercase">Las pistas se guardan solas</p>
        <textarea id="notes-area" oninput="saveNotes()" class="w-full h-[75%] bg-black/40 border border-gray-800 p-6 text-sm rounded-2xl focus:border-gold outline-none text-white leading-relaxed" placeholder="Ej: Acertijo Ónice = Nube..."></textarea>
    </div>

    <script>
        const sb = supabase.createClient('https://wsaxismjuiyvapdknjoi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYXhpc21qdWl5dmFwZGtuam9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQxODMsImV4cCI6MjEwMjQ2MDE4M30.athADmclWSEjUDCPZX2agiUgEDiEzKZipal24BbQs50');

        let save = JSON.parse(localStorage.getItem('enigma_v12')) || { id: 1, items: [], hp: 3, notes: "" };

        async function engine(id) {
            save.id = id;
            localStorage.setItem('enigma_v12', JSON.stringify(save));
            
            const { data: esc } = await sb.from('escenas').select('*').eq('id', id).single();
            const { data: decs } = await sb.from('decisiones').select('*').eq('escena_origen_id', id);

            if(!esc) return resetGame();

            document.getElementById('sc-titulo').innerText = esc.titulo_escena;
            document.getElementById('sc-texto').innerHTML = esc.texto_narrativo.split('\n').map(p => `<p class="mb-6">${p}</p>`).join('');

            const imgCont = document.getElementById('img-cont');
            if(esc.imagen_url) { document.getElementById('sc-img').src = esc.imagen_url; imgCont.classList.remove('hidden'); }
            else { imgCont.classList.add('hidden'); }

            const optDiv = document.getElementById('sc-opciones');
            optDiv.innerHTML = '';

            decs.forEach(d => {
                const b = document.createElement('button');
                b.className = "choice-btn flex justify-between items-center group";
                const locked = d.item_requerido && !save.items.includes(d.item_requerido);
                
                b.innerHTML = locked ? `<span>🔒 ${d.texto_boton}</span>` : `<span>${d.texto_boton}</span> <span class="gold opacity-0 group-hover:opacity-100 transition">→</span>`;
                b.disabled = locked;

                b.onclick = () => {
                    // Lógica de acertijos específicos
                    if(id === 19 || id === 32) {
                        const input = prompt("Luz debe susurrar la respuesta correcta:").toLowerCase().trim();
                        const correctas = { 19: ["nube", "una nube"], 32: ["la letra e", "e"] };
                        if(!correctas[id].includes(input)) {
                            alert("La criatura te mira con frialdad. No es la respuesta. Pierdes valor.");
                            save.hp--; updateUI(); return;
                        }
                    }
                    if(d.item_entregado && !save.items.includes(d.item_entregado)) save.items.push(d.item_entregado);
                    engine(d.escena_destino_id);
                };
                optDiv.appendChild(b);
            });
            updateUI();
        }

        function updateUI() {
            document.getElementById('hearts').innerText = "❤️".repeat(Math.max(0, save.hp));
            document.getElementById('inv-list').innerHTML = save.items.map(i => `<div class="inventory-slot">🏷️ ${i}</div>`).join('');
            if(save.hp <= 0) { alert("Tu luz se ha apagado... El Bosque te ha consumido."); resetGame(); }
        }

        function saveNotes() { save.notes = document.getElementById('notes-area').value; localStorage.setItem('enigma_v12', JSON.stringify(save)); }
        function resetGame() { localStorage.removeItem('enigma_v12'); location.reload(); }
        window.onload = () => { document.getElementById('notes-area').value = save.notes; engine(save.id); };
    </script>
</body>
</html>
