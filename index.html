<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENIGMA - El Grimorio de Luz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Crimson Pro', serif; background-color: #0B0E14; color: #E5E7EB; line-height: 1.8; }
        .gold-text { color: #C9A063; }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(201, 160, 99, 0.3); }
        .choice-btn { border: 1px solid rgba(201, 160, 99, 0.3); transition: all 0.3s; background: rgba(255,255,255,0.02); }
        .choice-btn:hover:not(:disabled) { border-color: #C9A063; background: rgba(201, 160, 99, 0.1); transform: translateX(8px); }
        .notepad-input { background: #1a1c23; border: 1px border-gold/20; color: #d1d5db; scrollbar-width: thin; }
        p { margin-bottom: 1.5rem; font-size: 1.25rem; text-align: justify; }
        .sidebar { transition: transform 0.3s ease-in-out; }
        .hidden-sidebar { transform: translateX(100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center overflow-x-hidden">
    
    <nav class="w-full max-w-4xl flex justify-between items-center p-6 sticky top-0 z-50 bg-[#0B0E14]/95 border-b border-gold/20">
        <div class="flex flex-col">
            <h1 class="text-2xl gold-text font-bold italic tracking-tighter">ENIGMA</h1>
            <div id="valor-hearts" class="flex gap-1 text-xl mt-1"></div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleNotepad()" class="p-2 glass-panel rounded-lg hover:border-gold transition">📔 <span class="text-[10px] uppercase ml-1">Notas</span></button>
            <button onclick="reiniciarAventura()" class="text-[10px] uppercase border border-gray-700 px-3 py-2 rounded text-gray-500 hover:text-red-500 transition">Reiniciar</button>
        </div>
    </nav>

    <main class="max-w-4xl w-full p-6 flex flex-col md:flex-row gap-8">
        <div id="pantalla-juego" class="flex-1 space-y-8">
           <div id="escena-container" class="glass-panel p-8 md:p-12 rounded-[2rem] shadow-2xl transition-all duration-700">
                <div id="contenedor-imagen" class="hidden mb-8 rounded-2xl overflow-hidden border border-gold/10 shadow-2xl">
                    <img id="escena-imagen" src="" alt="Escena" class="w-full h-auto object-cover max-h-[450px]">
                </div>
                <h2 id="escena-titulo" class="text-3xl md:text-5xl font-bold gold-text mb-8 tracking-tight"></h2>
                <div id="escena-texto" class="text-gray-300"></div>
            </div>
            <div id="opciones" class="grid grid-cols-1 gap-4"></div>
        </div>

        <aside class="w-full md:w-48 space-y-4">
            <h3 class="text-xs uppercase tracking-widest gold-text font-bold">Mochila</h3>
            <div id="mochila" class="flex flex-col gap-2"></div>
        </aside>
    </main>

    <!-- NOTEPAD SIDEBAR -->
    <div id="notepad-sidebar" class="fixed right-0 top-0 h-full w-80 sidebar z-[100] glass-panel p-6 shadow-2xl hidden-sidebar">
        <div class="flex justify-between items-center mb-6">
            <h3 class="gold-text font-bold uppercase tracking-widest">Diario de Luz</h3>
            <button onclick="toggleNotepad()" class="text-gray-500 hover:text-white text-2xl">×</button>
        </div>
        <textarea id="notepad-text" oninput="saveNotes()" class="w-full h-[80%] notepad-input p-4 rounded-xl resize-none focus:outline-none focus:border-gold" placeholder="Escribre las pistas aquí (códigos, olores, nombres)..."></textarea>
    </div>

    <!-- PANTALLA FINAL -->
    <div id="pantalla-final" class="hidden fixed inset-0 z-[200] bg-black/98 flex flex-col items-center justify-center p-8 text-center space-y-8">
        <h2 id="final-mensaje" class="text-5xl font-bold gold-text"></h2>
        <div id="lista-medallas" class="flex flex-wrap justify-center gap-6"></div>
        <button onclick="reiniciarAventura()" class="px-12 py-5 glass-panel rounded-full gold-text border-gold/50 hover:bg-gold/20 transition text-xl uppercase tracking-widest">Despertar</button>
    </div>

    <script>
        const URL_PROYECTO = 'https://wsaxismjuiyvapdknjoi.supabase.co'; 
        const KEY_PROYECTO = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYXhpc21qdWl5dmFwZGtuam9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQxODMsImV4cCI6MjEwMjQ2MDE4M30.athADmclWSEjUDCPZX2agiUgEDiEzKZipal24BbQs50';
        const { createClient } = supabase;
        const enigma = createClient(URL_PROYECTO, KEY_PROYECTO);

        let estado = JSON.parse(localStorage.getItem('enigma_save')) || { escenaActual: 1, valor: 3, inventario: [], notas: "" };

        function guardarPartida() { localStorage.setItem('enigma_save', JSON.stringify(estado)); }

        function toggleNotepad() {
            document.getElementById('notepad-sidebar').classList.toggle('hidden-sidebar');
        }

        function saveNotes() {
            estado.notas = document.getElementById('notepad-text').value;
            guardarPartida();
        }

        function reiniciarAventura() {
            if (confirm("¿Reiniciar el sueño?")) { localStorage.removeItem('enigma_save'); location.reload(); }
        }

        async function cargarEscena(id) {
            estado.escenaActual = id;
            guardarPartida();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            const { data: escena } = await enigma.from('escenas').select('*').eq('id', id).single();
            const { data: decisiones } = await enigma.from('decisiones').select('*').eq('escena_origen_id', id);

            if (!escena) return;

            // Imagen y Emoción
            const cImg = document.getElementById('contenedor-imagen');
            if (escena.imagen_url) { document.getElementById('escena-imagen').src = escena.imagen_url; cImg.classList.remove('hidden'); }
            else { cImg.classList.add('hidden'); }

            const cont = document.getElementById('escena-container');
            const color = escena.titulo_escena.includes("Ira") ? "#ef4444" : escena.titulo_escena.includes("Tristeza") ? "#3b82f6" : escena.titulo_escena.includes("Miedo") ? "#6b7280" : "rgba(201, 160, 99, 0.3)";
            cont.style.borderColor = color;

            document.getElementById('escena-titulo').innerText = escena.titulo_escena;
            document.getElementById('escena-texto').innerHTML = escena.texto_narrativo.split('\n').map(p => `<p>${p}</p>`).join('');

            const contenedorOpciones = document.getElementById('opciones');
            contenedorOpciones.innerHTML = '';

            // Finales
            if (id >= 99) { setTimeout(() => mostrarFinal(escena.titulo_escena), 2000); return; }

            decisiones.forEach(opc => {
                const b = document.createElement('button');
                b.className = "w-full p-6 glass-panel rounded-2xl text-left choice-btn flex justify-between items-center group";
                
                b.onclick = () => {
                    // Lógica de Enigma con código
                    if (opc.texto_boton.includes("[CÓDIGO]")) {
                        const res = prompt("Introduce el código de 3 dígitos:");
                        if (res === "7") { cargarEscena(opc.escena_destino_id); }
                        else { 
                            alert("El código es incorrecto. El aire se vuelve frío..."); 
                            estado.valor -= 1; 
                            if(estado.valor <= 0) { alert("Has perdido todo tu valor. El Gran Gris te ha atrapado."); reiniciarAventura(); }
                            actualizarUI(); 
                        }
                    } else {
                        // Recolección de objetos
                        if (opc.texto_boton.includes("Ticket")) recolectar("Ticket Dorado");
                        if (opc.texto_boton.includes("Cinta")) recolectar("Cinta Familiar");
                        if (opc.texto_boton.includes("Grimorio")) recolectar("Grimorio");
                        cargarEscena(opc.escena_destino_id);
                    }
                };

                b.innerHTML = `<span class="font-bold text-lg">${opc.texto_boton}</span> <span class="gold-text">→</span>`;
                contenedorOpciones.appendChild(b);
            });
            actualizarUI();
        }

        function recolectar(item) {
            if (!estado.inventario.includes(item)) {
                estado.inventario.push(item);
                guardarPartida();
                actualizarUI();
            }
        }

        function actualizarUI() {
            document.getElementById('valor-hearts').innerText = "❤️".repeat(Math.max(0, estado.valor));
            const m = document.getElementById('mochila');
            m.innerHTML = estado.inventario.map(i => `<div class="p-2 glass-panel rounded-xl text-[10px] gold-text font-bold text-center uppercase mb-2">🏷️ ${i}</div>`).join('');
            if(estado.inventario.length === 0) m.innerHTML = '<span class="text-[10px] text-gray-600 italic">Vacía</span>';
        }

        function mostrarFinal(titulo) {
            document.getElementById('pantalla-final').classList.remove('hidden');
            document.getElementById('final-mensaje').innerText = titulo;
            const lista = document.getElementById('lista-medallas');
            lista.innerHTML = '';
            const logros = [
                { c: estado.valor === 3, i: '🏅', t: 'Perfecta' },
                { c: estado.inventario.length >= 2, i: '🎒', t: 'Exploradora' },
                { c: true, i: '✨', t: 'Soñadora' }
            ];
            logros.forEach(l => { if (l.c) {
                lista.innerHTML += `<div class="p-6 glass-panel rounded-3xl w-32 flex flex-col items-center">
                    <span class="text-4xl mb-2">${l.i}</span>
                    <span class="text-[10px] gold-text font-bold uppercase">${l.t}</span>
                </div>`;
            }});
        }

        window.onload = () => {
            document.getElementById('notepad-text').value = estado.notas;
            cargarEscena(estado.escenaActual);
        };
    </script>
</body>
</html>
