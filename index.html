<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENIGMA - Luz y el Circo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Crimson Pro', serif; background-color: #0B0E14; color: #E5E7EB; line-height: 1.8; }
        .gold-text { color: #C9A063; }
        .glass-panel { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(201, 160, 99, 0.2); }
        .choice-btn { border: 1px solid rgba(201, 160, 99, 0.3); transition: all 0.3s ease; background: rgba(255,255,255,0.03); }
        .choice-btn:hover:not(:disabled) { border-color: #C9A063; background: rgba(201, 160, 99, 0.1); transform: translateY(-2px); }
        p { margin-bottom: 1.5rem; font-size: 1.3rem; text-align: justify; }
        .inventory-badge { background: linear-gradient(45deg, #2D1B06, #0B0E14); border: 1px solid #C9A063; font-size: 0.7rem; }
        .btn-reiniciar { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #6b7280; border: 1px solid #374151; padding: 4px 8px; border-radius: 4px; transition: all 0.3s; }
        .btn-reiniciar:hover { color: #ef4444; border-color: #ef4444; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
    
    <!-- NAVEGACIÓN ACTUALIZADA CON BOTÓN REINICIAR -->
    <nav class="w-full max-w-3xl flex justify-between items-center p-6 sticky top-0 z-50 bg-[#0B0E14]/95 border-b border-gold/10">
        <div class="flex flex-col">
            <span class="text-[10px] uppercase tracking-[0.3em] gold-text font-bold">Mythos Engine v4.0</span>
            <div id="valor-hearts" class="flex gap-1 text-xl mt-1"></div>
        </div>
        
        <div class="flex items-center gap-4">
            <!-- AQUÍ ESTÁ EL BOTÓN NUEVO -->
            <button onclick="reiniciarAventura()" class="btn-reiniciar">
                Reiniciar
            </button>
            <div id="mochila" class="flex gap-2"></div>
        </div>
    </nav>

    <main class="max-w-3xl w-full p-6 pb-24">
        <div id="pantalla-juego" class="space-y-8 animate-fade-in">
           <div id="escena-container" class="glass-panel p-8 md:p-12 rounded-[2rem] shadow-2xl transition-all duration-500">
                
                <!-- CONTENEDOR DE IMAGEN -->
                <div id="contenedor-imagen" class="hidden mb-6 rounded-xl overflow-hidden border border-gold/10">
                    <img id="escena-imagen" src="" alt="Ilustración" class="w-full h-auto object-cover max-h-[400px]">
                </div>

                <h2 id="escena-titulo" class="text-3xl md:text-4xl font-bold gold-text mb-8 tracking-tight"></h2>
                <div id="escena-texto" class="text-gray-300"></div>
            </div>
            <div id="opciones" class="grid grid-cols-1 gap-4"></div>
        </div>
    </main>

    <script>
        const URL_PROYECTO = 'https://wsaxismjuiyvapdknjoi.supabase.co'; 
        const KEY_PROYECTO = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYXhpc21qdWl5dmFwZGtuam9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQxODMsImV4cCI6MjEwMjQ2MDE4M30.athADmclWSEjUDCPZX2agiUgEDiEzKZipal24BbQs50';
        const { createClient } = supabase;
        const enigma = createClient(URL_PROYECTO, KEY_PROYECTO);

        // ESTADO GLOBAL PERSISTENTE
        let estado = JSON.parse(localStorage.getItem('enigma_save')) || { 
            escenaActual: 1, 
            valor: 3, 
            inventario: [] 
        };

        function guardarPartida() {
            localStorage.setItem('enigma_save', JSON.stringify(estado));
        }

        // --- NUEVA FUNCIÓN PARA REINICIAR ---
        function reiniciarAventura() {
            if (confirm("¿Quieres empezar de nuevo? Se borrará tu mochila y tu progreso.")) {
                localStorage.removeItem('enigma_save');
                estado = { escenaActual: 1, valor: 3, inventario: [] };
                cargarEscena(1);
            }
        }

        async function cargarEscena(id) {
            estado.escenaActual = id;
            guardarPartida();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            const { data: escena } = await enigma.from('escenas').select('*').eq('id', id).single();
            const { data: decisiones } = await enigma.from('decisiones').select('*').eq('escena_origen_id', id);

            if (!escena) return;

            // --- LÓGICA DE IMÁGENES ---
            const contenedorImagen = document.getElementById('contenedor-imagen');
            const imgElemento = document.getElementById('escena-imagen');
            
            if (escena.imagen_url && escena.imagen_url.trim() !== "") {
                imgElemento.src = escena.imagen_url;
                contenedorImagen.classList.remove('hidden');
            } else {
                contenedorImagen.classList.add('hidden');
            }

            // --- SISTEMA DE EMOCIONES ---
            const contenedorPrincipal = document.getElementById('escena-container');
            if (contenedorPrincipal) {
                if (escena.titulo_escena.includes("Ira")) {
                    contenedorPrincipal.style.borderColor = "#ef4444"; 
                    contenedorPrincipal.style.boxShadow = "0 0 20px rgba(239, 68, 68, 0.2)";
                } else if (escena.titulo_escena.includes("Tristeza")) {
                    contenedorPrincipal.style.borderColor = "#3b82f6"; 
                    contenedorPrincipal.style.boxShadow = "0 0 20px rgba(59, 130, 246, 0.2)";
                } else if (escena.titulo_escena.includes("Miedo")) {
                    contenedorPrincipal.style.borderColor = "#6b7280"; 
                    contenedorPrincipal.style.boxShadow = "0 0 20px rgba(107, 114, 128, 0.2)";
                } else {
                    contenedorPrincipal.style.borderColor = "rgba(201, 160, 99, 0.2)"; 
                    contenedorPrincipal.style.boxShadow = "none";
                }
            }

            document.getElementById('escena-titulo').innerText = escena.titulo_escena;
            document.getElementById('escena-texto').innerHTML = escena.texto_narrativo.split('\n').map(p => `<p>${p}</p>`).join('');

            const contenedor = document.getElementById('opciones');
            contenedor.innerHTML = '';

            decisiones.forEach(opc => {
                const b = document.createElement('button');
                b.className = "w-full p-5 glass-panel rounded-2xl text-left choice-btn flex justify-between items-center group";
                
                const necesitaTicket = opc.texto_boton.toLowerCase().includes("entrar a la carpa");
                const tieneTicket = estado.inventario.includes("Ticket Dorado");

                if (necesitaTicket && !tieneTicket) {
                    b.innerHTML = `<span class="opacity-40 italic">🔒 ${opc.texto_boton}</span> <span class="text-[10px] gold-text">Falta Ticket</span>`;
                    b.disabled = true;
                } else {
                    b.innerHTML = `<span class="font-bold text-lg">${opc.texto_boton}</span> <span class="gold-text opacity-0 group-hover:opacity-100 transition">→</span>`;
                    b.onclick = () => {
                        if (opc.texto_boton.includes("Buscar entre los arbustos")) recolectar("Ticket Dorado");
                        cargarEscena(opc.escena_destino_id);
                    };
                }
                contenedor.appendChild(b);
            });
            actualizarUI();
        }

        function recolectar(item) {
            if (!estado.inventario.includes(item)) {
                estado.inventario.push(item);
                guardarPartida();
                actualizarUI();
            }
        }

        function actualizarUI() {
            document.getElementById('valor-hearts').innerText = "❤️".repeat(estado.valor);
            const mochila = document.getElementById('mochila');
            mochila.innerHTML = estado.inventario.map(i => `<span class="px-3 py-1 inventory-badge rounded-full gold-text font-bold">🏷️ ${i}</span>`).join('');
        }

        window.onload = () => cargarEscena(estado.escenaActual);
    </script>
</body>
</html>
