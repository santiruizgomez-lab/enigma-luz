<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ENIGMA: El Legado de Luz</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #05070a; color: #d1d5db; font-family: 'Crimson Pro', serif; }
        .gold { color: #C9A063; }
        .glass { background: rgba(20, 25, 35, 0.95); border: 1px solid rgba(201, 160, 99, 0.2); backdrop-filter: blur(10px); }
        .btn { width: 100%; padding: 1.2rem; border: 1px solid rgba(201, 160, 99, 0.3); border-radius: 15px; text-align: left; transition: 0.3s; background: rgba(255,255,255,0.02); margin-bottom: 0.8rem; }
        .btn:hover:not(:disabled) { border-color: #C9A063; background: rgba(201, 160, 99, 0.1); transform: translateX(5px); }
        .btn:disabled { opacity: 0.2; filter: grayscale(1); }
        .sidebar { position: fixed; right: 0; top: 0; height: 100%; width: 320px; transform: translateX(100%); transition: 0.4s; z-index: 100; }
        .sidebar.open { transform: translateX(0); }
    </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen">
    <nav class="w-full max-w-5xl flex justify-between items-center mb-8 border-b border-gray-800 pb-6">
        <h1 class="text-4xl gold font-bold italic tracking-tighter">ENIGMA</h1>
        <div class="flex gap-4">
            <button onclick="document.getElementById('diary').classList.toggle('open')" class="px-5 py-2 glass gold rounded-full text-xs uppercase font-bold border-gold">📔 Diario</button>
            <button onclick="resetGame()" class="text-xs text-gray-600 hover:text-red-500 uppercase">Reset</button>
        </div>
    </nav>

    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-4 gap-8">
        <!-- MOCHILA -->
        <aside class="hidden lg:block space-y-4">
            <h3 class="text-xs uppercase gold font-bold tracking-widest mb-4">Mochila de Luz</h3>
            <div id="inv-list" class="space-y-2"></div>
        </aside>

        <!-- ESCENA -->
        <section class="lg:col-span-3">
            <div id="status-ui" class="flex justify-between text-[10px] gold uppercase mb-4 px-2 tracking-widest">
                <div id="health"></div>
                <div id="location"></div>
            </div>
            
            <div class="glass p-8 md:p-12 rounded-[2.5rem] shadow-2xl border-2">
                <div id="img-cont" class="hidden mb-8 rounded-3xl overflow-hidden border border-gold/20 shadow-2xl">
                    <img id="sc-img" src="" class="w-full h-auto object-cover max-h-[450px]">
                </div>
                <h2 id="sc-titulo" class="text-3xl md:text-5xl font-bold gold mb-6"></h2>
                <div id="sc-texto" class="text-xl md:text-2xl leading-relaxed text-gray-300 italic mb-10"></div>
                <div id="sc-opciones" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </section>
    </main>

    <div id="diary" class="sidebar glass p-8 shadow-2xl">
        <h3 class="gold font-bold uppercase mb-6 tracking-widest text-center">Notas de Luz</h3>
        <textarea id="notes-area" oninput="saveNotes()" class="w-full h-[70%] bg-transparent border border-gray-800 p-4 text-sm rounded-xl focus:border-gold outline-none text-white" placeholder="Anota pistas de la historia..."></textarea>
        <div id="inv-mobile" class="lg:hidden mt-6 space-y-2"></div>
    </div>

    <script>
        const sb = supabase.createClient('https://wsaxismjuiyvapdknjoi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYXhpc21qdWl5dmFwZGtuam9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQxODMsImV4cCI6MjEwMjQ2MDE4M30.athADmclWSEjUDCPZX2agiUgEDiEzKZipal24BbQs50');

        let save = JSON.parse(localStorage.getItem('enigma_final')) || { id: 1, items: [], hp: 3, notes: "" };

        async function engine(id) {
            save.id = id;
            localStorage.setItem('enigma_final', JSON.stringify(save));
            
            const { data: esc } = await sb.from('escenas').select('*').eq('id', id).single();
            const { data: decs } = await sb.from('decisiones').select('*').eq('escena_origen_id', id);

            if(!esc) return resetGame();

            document.getElementById('sc-titulo').innerText = esc.titulo_escena;
            document.getElementById('sc-texto').innerHTML = esc.texto_narrativo.split('\n').map(p => `<p class="mb-4">${p}</p>`).join('');
            document.getElementById('location').innerText = "Zona: " + (esc.zona || "Desconocida");

            const imgCont = document.getElementById('img-cont');
            if(esc.imagen_url) { document.getElementById('sc-img').src = esc.imagen_url; imgCont.classList.remove('hidden'); }
            else { imgCont.classList.add('hidden'); }

            const optDiv = document.getElementById('sc-opciones');
            optDiv.innerHTML = '';

            decs.forEach(d => {
                const b = document.createElement('button');
                b.className = "choice-btn flex justify-between items-center group";
                const locked = d.item_requerido && !save.items.includes(d.item_requerido);
                
                b.innerHTML = locked ? `<span>🔒 ${d.texto_boton}</span>` : `<span>${d.texto_boton}</span> <span class="gold">→</span>`;
                b.disabled = locked;

                b.onclick = () => {
                    if(d.es_codigo) {
                        const res = prompt("Introduce el código de 4 dígitos:");
                        if(res !== "1864") { alert("El tiempo retrocede... pierdes energía."); save.hp--; updateUI(); return; }
                    }
                    if(d.item_entregado && !save.items.includes(d.item_entregado)) {
                        save.items.push(d.item_entregado);
                        alert("Has encontrado: " + d.item_entregado);
                    }
                    engine(d.escena_destino_id);
                };
                optDiv.appendChild(b);
            });
            updateUI();
        }

        function updateUI() {
            document.getElementById('health').innerText = "Valor: " + "❤️".repeat(Math.max(0, save.hp));
            const list = save.items.map(i => `<div class="p-3 border border-gold/30 rounded-xl text-[10px] gold uppercase tracking-tighter text-center">🏷️ ${i}</div>`).join('');
            document.getElementById('inv-list').innerHTML = list;
            document.getElementById('inv-mobile').innerHTML = list;
            if(save.hp <= 0) { alert("Tu valor se agotó. El Gran Gris te ha borrado."); resetGame(); }
        }

        function saveNotes() { save.notes = document.getElementById('notes-area').value; localStorage.setItem('enigma_final', JSON.stringify(save)); }
        function resetGame() { localStorage.removeItem('enigma_final'); location.reload(); }
        window.onload = () => { document.getElementById('notes-area').value = save.notes; engine(save.id); };
    </script>
</body>
</html>
