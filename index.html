<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ENIGMA - INVESTIGACIÓN</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #05070a; color: #d1d5db; font-family: serif; }
        .gold { color: #C9A063; }
        .glass { background: rgba(20, 25, 35, 0.95); border: 1px solid rgba(201, 160, 99, 0.2); backdrop-filter: blur(10px); }
        .btn { width: 100%; padding: 1.2rem; border: 1px solid rgba(201, 160, 99, 0.3); border-radius: 15px; text-align: left; transition: 0.3s; background: rgba(255,255,255,0.02); margin-bottom: 0.8rem; }
        .btn:hover:not(:disabled) { border-color: #C9A063; background: rgba(201, 160, 99, 0.1); }
        .btn:disabled { opacity: 0.2; cursor: not-allowed; }
    </style>
</head>
<body class="p-6 flex flex-col items-center min-h-screen">
    <nav class="w-full max-w-2xl flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <h1 class="text-3xl gold font-bold italic tracking-tighter text-orange-200">ENIGMA</h1>
        <div class="flex gap-4">
            <button onclick="alert(save.notes || 'Diario vacío')" class="text-xs gold uppercase">📔 Ver Notas</button>
            <button onclick="reset()" class="text-xs text-gray-500 uppercase">Reset</button>
        </div>
    </nav>

    <main class="w-full max-w-2xl space-y-6">
        <div class="flex justify-between text-[10px] gold uppercase tracking-widest px-2">
            <div id="hp"></div>
            <div id="mochila"></div>
        </div>

        <div class="glass p-8 rounded-[2rem] shadow-2xl border-2">
            <div id="img-cont" class="hidden mb-6 rounded-2xl overflow-hidden"><img id="foto" class="w-full"></div>
            <h2 id="titulo" class="text-3xl font-bold gold mb-4"></h2>
            <div id="texto" class="text-xl italic text-gray-300 mb-8 leading-relaxed"></div>
            <div id="opciones"></div>
        </div>
        
        <textarea id="diario" oninput="saveNotes()" class="w-full h-32 bg-gray-900 border border-gray-800 p-4 rounded-xl text-sm outline-none focus:border-gold" placeholder="Anota tus hallazgos aquí..."></textarea>
    </main>

    <script>
        const sb = supabase.createClient('https://wsaxismjuiyvapdknjoi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYXhpc21qdWl5dmFwZGtuam9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQxODMsImV4cCI6MjEwMjQ2MDE4M30.athADmclWSEjUDCPZX2agiUgEDiEzKZipal24BbQs50');
        let save = JSON.parse(localStorage.getItem('save_v30')) || { id: 1, items: [], hp: 3, notes: "" };

        async function play(id) {
            save.id = id;
            localStorage.setItem('save_v30', JSON.stringify(save));
            const { data: esc } = await sb.from('escenas').select('*').eq('id', id).single();
            const { data: decs } = await sb.from('decisiones').select('*').eq('escena_origen_id', id);

            if(!esc) return;

            document.getElementById('titulo').innerText = esc.titulo_escena;
            document.getElementById('texto').innerText = esc.texto_narrativo;
            
            const img = document.getElementById('img-cont');
            if(esc.imagen_url) { document.getElementById('foto').src = esc.imagen_url; img.classList.remove('hidden'); }
            else { img.classList.add('hidden'); }

            const div = document.getElementById('opciones');
            div.innerHTML = '';
            decs.forEach(d => {
                const b = document.createElement('button');
                b.className = "btn";
                const lock = d.item_requerido && !save.items.includes(d.item_requerido);
                b.innerHTML = lock ? `🔒 ${d.texto_boton} (Necesitas ${d.item_requerido})` : d.texto_boton;
                b.disabled = lock;

                b.onclick = () => {
                    if(d.respuesta_acertijo) {
                        const res = prompt("Introduce el secreto:").toLowerCase().trim();
                        if(res !== d.respuesta_acertijo.toLowerCase()) {
                            alert("Fallo... el mundo se oscurece."); save.hp--; updateUI(); return;
                        }
                    }
                    if(d.item_entregado && !save.items.includes(d.item_entregado)) save.items.push(d.item_entregado);
                    play(d.escena_destino_id);
                };
                div.appendChild(b);
            });
            updateUI();
        }

        function updateUI() {
            document.getElementById('hp').innerText = "❤️".repeat(Math.max(0, save.hp));
            document.getElementById('mochila').innerText = "Mochila: " + (save.items.join(', ') || "Vacía");
            if(save.hp <= 0) { alert("Tu mente ha colapsado. El Gran Gris te tiene."); reset(); }
        }

        function saveNotes() { save.notes = document.getElementById('diario').value; localStorage.setItem('save_v30', JSON.stringify(save)); }
        function reset() { localStorage.removeItem('save_v30'); location.reload(); }
        window.onload = () => { document.getElementById('diario').value = save.notes; play(save.id); };
    </script>
</body>
</html>
