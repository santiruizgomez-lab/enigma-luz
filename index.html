<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENIGMA - Investigadora de Sueños</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Crimson Pro', serif; background-color: #0B0E14; color: #E5E7EB; overflow-x: hidden; }
        .gold-text { color: #C9A063; }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(201, 160, 99, 0.3); }
        .choice-btn { border: 1px solid rgba(201, 160, 99, 0.3); transition: all 0.3s; background: rgba(255,255,255,0.02); }
        .choice-btn:hover:not(:disabled) { border-color: #C9A063; background: rgba(201, 160, 99, 0.1); transform: scale(1.02); }
        .notepad-input { background: #1a1c23; border: 1px solid #374151; color: #d1d5db; font-family: monospace; }
        .img-zoom:hover { transform: scale(1.5); cursor: zoom-in; }
        .img-container { transition: transform 0.5s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.2s ease-in-out 0s 2; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
    
    <!-- HEADER -->
    <nav class="w-full max-w-5xl flex justify-between items-center p-6 sticky top-0 z-50 bg-[#0B0E14]/95 border-b border-gold/20">
        <div class="flex flex-col">
            <h1 class="text-3xl gold-text font-bold italic tracking-tighter">ENIGMA</h1>
            <div id="valor-hearts" class="flex gap-1 text-xl mt-1"></div>
        </div>
        
        <div class="flex items-center gap-4">
            <button onclick="toggleNotepad()" class="px-4 py-2 glass-panel rounded-full text-xs uppercase gold-text font-bold">📔 Diario</button>
            <button onclick="reiniciarAventura()" class="text-[10px] text-gray-600 hover:text-red-500 transition uppercase">Reiniciar</button>
        </div>
    </nav>

    <main class="max-w-5xl w-full p-6 flex flex-col lg:flex-row gap-8">
        <!-- ÁREA DE JUEGO -->
        <div id="game-area" class="flex-1 space-y-8">
           <div id="escena-container" class="glass-panel p-8 md:p-12 rounded-[2.5rem] shadow-2xl transition-all duration-700 relative overflow-hidden">
                <!-- Imagen con Zoom para Pistas -->
                <div id="contenedor-imagen" class="hidden mb-8 rounded-3xl overflow-hidden border border-gold/20 shadow-inner bg-black">
                    <img id="escena-imagen" src="" alt="Escena" class="w-full h-auto object-cover max-h-[500px] img-zoom transition-transform duration-500">
                </div>
                <h2 id="escena-titulo" class="text-3xl md:text-5xl font-bold gold-text mb-6 tracking-tight"></h2>
                <div id="escena-texto" class="text-xl leading-relaxed text-gray-300 italic"></div>
            </div>
            
            <!-- Botones de Decisión -->
            <div id="opciones" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- BARRA LATERAL: MOCHILA Y ESTADO -->
        <aside class="w-full lg:w-64 space-y-6">
            <div class="glass-panel p-6 rounded-3xl">
                <h3 class="text-xs uppercase tracking-[0.2em] gold-text font-bold mb-4">Inventario</h3>
                <div id="mochila" class="grid grid-cols-2 lg:grid-cols-1 gap-3 text-center"></div>
            </div>
            <p class="text-[10px] text-gray-600 italic">Haz zoom en las imágenes para buscar pistas ocultas.</p>
        </aside>
    </main>

    <!-- DIARIO DE INVESTIGACIÓN -->
    <div id="notepad-sidebar" class="fixed right-0 top-0 h-full w-80 z-[100] glass-panel p-8 shadow-2xl transition-transform duration-500 translate-x-full">
        <div class="flex justify-between items-center mb-6">
            <h3 class="gold-text font-bold uppercase">Diario de Luz</h3>
            <button onclick="toggleNotepad()" class="text-2xl">×</button>
        </div>
        <textarea id="notepad-text" oninput="saveNotes()" class="w-full h-[75%] notepad-input p-4 rounded-2xl resize-none focus:ring-1 focus:ring-gold outline-none text-sm" placeholder="Anota códigos, colores o pistas..."></textarea>
    </div>

    <!-- MODAL DE ACERTIJO -->
    <div id="modal-acertijo" class="hidden fixed inset-0 z-[150] bg-black/90 flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="glass-panel p-10 rounded-[3rem] max-w-md w-full text-center space-y-6">
            <h3 class="text-2xl gold-text font-bold">DESCIFRA EL ENIGMA</h3>
            <p id="acertijo-pista" class="italic text-gray-400"></p>
            <input type="text" id="acertijo-input" class="w-full p-4 rounded-2xl bg-gray-900 border border-gold/30 text-center text-2xl tracking-widest focus:border-gold outline-none">
            <div class="flex gap-4">
                <button onclick="cerrarAcertijo()" class="flex-1 p-4 rounded-2xl border border-gray-700">Cancelar</button>
                <button onclick="validarAcertijo()" class="flex-1 p-4 rounded-2xl bg-gold/20 border border-gold gold-text font-bold">Validar</button>
            </div>
        </div>
    </div>

    <script>
        const URL_PROYECTO = 'https://wsaxismjuiyvapdknjoi.supabase.co'; 
        const KEY_PROYECTO = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYXhpc21qdWl5dmFwZGtuam9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQxODMsImV4cCI6MjEwMjQ2MDE4M30.athADmclWSEjUDCPZX2agiUgEDiEzKZipal24BbQs50';
        const { createClient } = supabase;
        const enigma = createClient(URL_PROYECTO, KEY_PROYECTO);

        let estado = JSON.parse(localStorage.getItem('enigma_save')) || { escenaActual: 1, valor: 3, inventario: [], notas: "" };
        let choicePendiente = null;

        function guardarPartida() { localStorage.setItem('enigma_save', JSON.stringify(estado)); }

        function toggleNotepad() { document.getElementById('notepad-sidebar').classList.toggle('translate-x-full'); }
        function saveNotes() { estado.notas = document.getElementById('notepad-text').value; guardarPartida(); }
        function reiniciarAventura() { if(confirm("¿Reiniciar?")) { localStorage.removeItem('enigma_save'); location.reload(); } }

        async function cargarEscena(id) {
            estado.escenaActual = id;
            guardarPartida();
            
            const { data: escena } = await enigma.from('escenas').select('*').eq('id', id).single();
            const { data: decisiones } = await enigma.from('decisiones').select('*').eq('escena_origen_id', id);

            if (!escena) return;

            // Visuales
            if (escena.imagen_url) { document.getElementById('escena-imagen').src = escena.imagen_url; document.getElementById('contenedor-imagen').classList.remove('hidden'); }
            else { document.getElementById('contenedor-imagen').classList.add('hidden'); }

            document.getElementById('escena-titulo').innerText = escena.titulo_escena;
            document.getElementById('escena-texto').innerHTML = escena.texto_narrativo.split('\n').map(p => `<p class="mb-4">${p}</p>`).join('');

            // Opciones
            const contenedor = document.getElementById('opciones');
            contenedor.innerHTML = '';
            decisiones.forEach(opc => {
                const b = document.createElement('button');
                b.className = "w-full p-6 glass-panel rounded-3xl text-left choice-btn flex justify-between items-center group";
                b.onclick = () => procesarDecision(opc);
                b.innerHTML = `<span class="font-bold text-lg">${opc.texto_boton}</span> <span class="gold-text">→</span>`;
                contenedor.appendChild(b);
            });
            actualizarUI();
        }

        function procesarDecision(opc) {
            // Si la decisión tiene un acertijo
            if (opc.texto_boton.includes("[?]")) {
                choicePendiente = opc;
                document.getElementById('acertijo-pista').innerText = "¿Cuál es la respuesta que Luz anotó en su diario?";
                document.getElementById('modal-acertijo').classList.remove('hidden');
                document.getElementById('acertijo-input').focus();
            } else {
                if (opc.texto_boton.includes("Ticket")) recolectar("Ticket Cristal");
                if (opc.texto_boton.includes("Llave")) recolectar("Llave Runas");
                cargarEscena(opc.escena_destino_id);
            }
        }

        function validarAcertijo() {
            const input = document.getElementById('acertijo-input').value.toLowerCase().trim();
            // Lógica de respuestas (aquí puedes añadir más según la escena)
            const respuestasCorrectas = {
                20: ["7", "siete"],
                21: ["luz", "la luz"],
                25: ["olvido", "el olvido"]
            };

            const idOrigen = choicePendiente.escena_origen_id;
            if (respuestasCorrectas[idOrigen] && respuestasCorrectas[idOrigen].includes(input)) {
                cerrarAcertijo();
                cargarEscena(choicePendiente.escena_destino_id);
            } else {
                document.getElementById('modal-acertijo').classList.add('shake');
                setTimeout(() => document.getElementById('modal-acertijo').classList.remove('shake'), 200);
                estado.valor -= 1;
                actualizarUI();
                if(estado.valor <= 0) { alert("Tu valor se ha agotado..."); reiniciarAventura(); }
            }
        }

        function cerrarAcertijo() {
            document.getElementById('modal-acertijo').classList.add('hidden');
            document.getElementById('acertijo-input').value = "";
        }

        function recolectar(item) {
            if (!estado.inventario.includes(item)) {
                estado.inventario.push(item);
                actualizarUI();
                guardarPartida();
            }
        }

        function actualizarUI() {
            document.getElementById('valor-hearts').innerText = "❤️".repeat(Math.max(0, estado.valor));
            const m = document.getElementById('mochila');
            m.innerHTML = estado.inventario.map(i => `<div class="p-3 glass-panel rounded-2xl text-[10px] gold-text font-bold text-center uppercase tracking-tighter mb-2 border-gold/20">📦 ${i}</div>`).join('');
            if(estado.inventario.length === 0) m.innerHTML = '<span class="text-[10px] text-gray-600 italic">Mochila vacía</span>';
        }

        window.onload = () => {
            document.getElementById('notepad-text').value = estado.notas;
            cargarEscena(estado.escenaActual);
        };
    </script>
</body>
</html>
