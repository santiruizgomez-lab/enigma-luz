<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENIGMA - Investigadora de Sueños</title>
    <!-- Cargamos las librerías primero -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Crimson Pro', serif; background-color: #0B0E14; color: #E5E7EB; overflow-x: hidden; }
        .gold-text { color: #C9A063; }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(201, 160, 99, 0.3); }
        .choice-btn { border: 1px solid rgba(201, 160, 99, 0.3); transition: all 0.3s; background: rgba(255,255,255,0.02); }
        .choice-btn:hover:not(:disabled) { border-color: #C9A063; background: rgba(201, 160, 99, 0.1); transform: scale(1.01); }
        .notepad-input { background: #1a1c23; border: 1px solid #374151; color: #d1d5db; font-family: monospace; }
        .img-zoom:hover { transform: scale(1.3); cursor: zoom-in; }
        .sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: fixed; right: 0; top: 0; h-full; width: 320px; z-index: 100; }
        .hidden-sidebar { transform: translateX(100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
    
    <!-- HEADER -->
    <nav class="w-full max-w-5xl flex justify-between items-center p-6 sticky top-0 z-50 bg-[#0B0E14]/95 border-b border-gold/20">
        <div class="flex flex-col">
            <h1 class="text-3xl gold-text font-bold italic tracking-tighter">ENIGMA</h1>
            <div id="valor-hearts" class="flex gap-1 text-xl mt-1"></div>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="toggleNotepad()" class="px-4 py-2 glass-panel rounded-full text-xs uppercase gold-text font-bold">📔 Diario</button>
            <button onclick="reiniciarAventura()" class="text-[10px] text-gray-600 hover:text-red-500 transition uppercase">Reiniciar</button>
        </div>
    </nav>

    <main class="max-w-5xl w-full p-6 flex flex-col lg:flex-row gap-8">
        <div id="game-area" class="flex-1 space-y-8">
           <div id="escena-container" class="glass-panel p-8 md:p-12 rounded-[2.5rem] shadow-2xl transition-all duration-700 relative overflow-hidden border-2">
                <div id="contenedor-imagen" class="hidden mb-8 rounded-3xl overflow-hidden border border-gold/20 bg-black">
                    <img id="escena-imagen" src="" alt="Escena" class="w-full h-auto object-cover max-h-[500px] img-zoom transition-transform duration-500">
                </div>
                <h2 id="escena-titulo" class="text-3xl md:text-5xl font-bold gold-text mb-6 tracking-tight"></h2>
                <div id="escena-texto" class="text-xl leading-relaxed text-gray-300 italic"></div>
            </div>
            <div id="opciones" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <aside class="w-full lg:w-64 space-y-6">
            <div class="glass-panel p-6 rounded-3xl border-gold/20">
                <h3 class="text-xs uppercase tracking-[0.2em] gold-text font-bold mb-4">Mochila</h3>
                <div id="mochila" class="flex flex-col gap-2"></div>
            </div>
            <p class="text-[10px] text-gray-600 italic">Pasa el ratón por la imagen para buscar detalles ocultos.</p>
        </aside>
    </main>

    <!-- SIDEBAR DIARIO -->
    <div id="notepad-sidebar" class="sidebar h-full glass-panel p-8 shadow-2xl hidden-sidebar">
        <div class="flex justify-between items-center mb-6">
            <h3 class="gold-text font-bold uppercase">Diario de Luz</h3>
            <button onclick="toggleNotepad()" class="text-2xl">✕</button>
        </div>
        <textarea id="notepad-text" oninput="saveNotes()" class="w-full h-[80%] notepad-input p-4 rounded-2xl resize-none outline-none text-sm" placeholder="Anota pistas aquí..."></textarea>
    </div>

    <!-- MODAL ACERTIJO -->
    <div id="modal-acertijo" class="hidden fixed inset-0 z-[150] bg-black/90 flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="glass-panel p-10 rounded-[3rem] max-w-md w-full text-center space-y-6 border-2 border-gold">
            <h3 class="text-2xl gold-text font-bold uppercase tracking-widest">Descifra el Secreto</h3>
            <p class="italic text-gray-400">Introduce la respuesta que Luz anotó en su diario:</p>
            <input type="text" id="acertijo-input" class="w-full p-4 rounded-2xl bg-gray-900 border border-gold/30 text-center text-3xl tracking-widest focus:border-gold outline-none text-white">
            <div class="flex gap-4">
                <button onclick="cerrarAcertijo()" class="flex-1 p-4 rounded-2xl border border-gray-700">Cancelar</button>
                <button onclick="validarAcertijo()" class="flex-1 p-4 rounded-2xl bg-gold/20 border border-gold gold-text font-bold">Validar</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN
        const URL_PROYECTO = 'https://wsaxismjuiyvapdknjoi.supabase.co'; 
        const KEY_PROYECTO = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYXhpc21qdWl5dmFwZGtuam9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQxODMsImV4cCI6MjEwMjQ2MDE4M30.athADmclWSEjUDCPZX2agiUgEDiEzKZipal24BbQs50';
        
        let enigma;
        let estado = JSON.parse(localStorage.getItem('enigma_save')) || { escenaActual: 1, valor: 3, inventario: [], notas: "" };
        let choicePendiente = null;

        // INICIALIZACIÓN SEGURA
        window.onload = () => {
            if (typeof supabase === 'undefined') {
                alert("Error: No se pudo cargar la librería de Supabase. Revisa tu conexión.");
                return;
            }
            enigma = supabase.createClient(URL_PROYECTO, KEY_PROYECTO);
            document.getElementById('notepad-text').value = estado.notas;
            cargarEscena(estado.escenaActual);
        };

        function guardarPartida() { localStorage.setItem('enigma_save', JSON.stringify(estado)); }
        function toggleNotepad() { document.getElementById('notepad-sidebar').classList.toggle('hidden-sidebar'); }
        function saveNotes() { estado.notas = document.getElementById('notepad-text').value; guardarPartida(); }
        function reiniciarAventura() { if(confirm("¿Reiniciar el sueño?")) { localStorage.removeItem('enigma_save'); location.reload(); } }

        async function cargarEscena(id) {
            estado.escenaActual = id;
            guardarPartida();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            const { data: escena, error } = await enigma.from('escenas').select('*').eq('id', id).single();
            const { data: decisiones } = await enigma.from('decisiones').select('*').eq('escena_origen_id', id);

            if (error || !escena) return;

            // Visuales e Imagen
            const cImg = document.getElementById('contenedor-imagen');
            if (escena.imagen_url) { 
                document.getElementById('escena-imagen').src = escena.imagen_url; 
                cImg.classList.remove('hidden'); 
            } else { 
                cImg.classList.add('hidden'); 
            }

            // Emociones
            const cont = document.getElementById('escena-container');
            const color = escena.titulo_escena.includes("Ira") ? "#ef4444" : escena.titulo_escena.includes("Tristeza") ? "#3b82f6" : escena.titulo_escena.includes("Miedo") ? "#6b7280" : "rgba(201, 160, 99, 0.3)";
            cont.style.borderColor = color;

            document.getElementById('escena-titulo').innerText = escena.titulo_escena;
            document.getElementById('escena-texto').innerHTML = escena.texto_narrativo.split('\n').map(p => `<p class="mb-4">${p}</p>`).join('');

            // Opciones
            const contenedor = document.getElementById('opciones');
            contenedor.innerHTML = '';
            
            if (id >= 99) { setTimeout(() => mostrarFinal(escena.titulo_escena), 2000); return; }

            decisiones.forEach(opc => {
                const b = document.createElement('button');
                b.className = "w-full p-6 glass-panel rounded-3xl text-left choice-btn flex justify-between items-center group animate-fade-in";
                
                // Lógica de Bloqueo por Items
                const tieneItem = !opc.item_requerido || estado.inventario.includes(opc.item_requerido);

                if (!tieneItem) {
                    b.innerHTML = `<span class="opacity-30 italic">🔒 ${opc.texto_boton}</span> <span class="text-[10px] gold-text uppercase">Necesitas: ${opc.item_requerido}</span>`;
                    b.disabled = true;
                } else {
                    b.innerHTML = `<span class="font-bold text-lg">${opc.texto_boton}</span> <span class="gold-text">→</span>`;
                    b.onclick = () => {
                        if (opc.texto_boton.includes("[CÓDIGO]") || opc.texto_boton.includes("[?]")) {
                            choicePendiente = opc;
                            document.getElementById('modal-acertijo').classList.remove('hidden');
                            document.getElementById('acertijo-input').focus();
                        } else {
                            if (opc.item_entregado) recolectar(opc.item_entregado);
                            cargarEscena(opc.escena_destino_id);
                        }
                    };
                }
                contenedor.appendChild(b);
            });
            actualizarUI();
        }

        function validarAcertijo() {
            const input = document.getElementById('acertijo-input').value.toLowerCase().trim();
            const respuestas = {
                19: ["7", "siete"],
                23: ["7", "siete"],
                25: ["luz"],
                27: ["luna"]
            };

            if (respuestas[choicePendiente.escena_origen_id]?.includes(input)) {
                if (choicePendiente.item_entregado) recolectar(choicePendiente.item_entregado);
                cerrarAcertijo();
                cargarEscena(choicePendiente.escena_destino_id);
            } else {
                alert("Incorrecto. Luz siente una punzada de duda...");
                estado.valor -= 1;
                actualizarUI();
                if(estado.valor <= 0) { alert("Tu valor se ha agotado. El Gran Gris gana."); reiniciarAventura(); }
            }
        }

        function cerrarAcertijo() { document.getElementById('modal-acertijo').classList.add('hidden'); document.getElementById('acertijo-input').value = ""; }

        function recolectar(item) {
            if (!estado.inventario.includes(item)) {
                estado.inventario.push(item);
                actualizarUI();
                guardarPartida();
            }
        }

        function actualizarUI() {
            document.getElementById('valor-hearts').innerText = "❤️".repeat(Math.max(0, estado.valor));
            const m = document.getElementById('mochila');
            m.innerHTML = estado.inventario.map(i => `<div class="p-3 glass-panel rounded-2xl text-[10px] gold-text font-bold text-center uppercase border-gold/20">📦 ${i}</div>`).join('');
            if(estado.inventario.length === 0) m.innerHTML = '<span class="text-[10px] text-gray-500 italic">Mochila vacía</span>';
        }

        function mostrarFinal(msg) { /* ... lógica de final que ya tenías ... */ alert("FIN: " + msg); location.reload(); }
    </script>
</body>
</html>
