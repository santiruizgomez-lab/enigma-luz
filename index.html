<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ENIGMA - VERSIÓN FUNCIONAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#05070a] text-gray-200 p-6 font-serif flex flex-col items-center min-h-screen">
    
    <nav class="w-full max-w-2xl flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <h1 class="text-3xl font-bold text-[#C9A063]">ENIGMA</h1>
        <button onclick="localStorage.clear(); location.reload();" class="text-xs text-gray-500 border px-2 py-1 rounded">Reset</button>
    </nav>

    <main class="w-full max-w-2xl space-y-6">
        <div class="bg-gray-900/50 border-2 border-yellow-600/20 p-8 rounded-[2rem] shadow-2xl">
            <div id="img-cont" class="hidden mb-6 rounded-2xl overflow-hidden border border-gold/10">
                <img id="sc-img" src="" class="w-full h-auto object-cover max-h-[400px]">
            </div>
            <h2 id="sc-titulo" class="text-3xl font-bold text-[#C9A063] mb-4 text-center"></h2>
            <p id="sc-texto" class="text-xl italic text-gray-300 mb-8 text-center leading-relaxed"></p>
            <div id="sc-opciones" class="space-y-3"></div>
        </div>
        <div id="status" class="text-xs text-center gold"></div>
    </main>

    <script>
        const sb = supabase.createClient('https://wsaxismjuiyvapdknjoi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYXhpc21qdWl5dmFwZGtuam9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQxODMsImV4cCI6MjEwMjQ2MDE4M30.athADmclWSEjUDCPZX2agiUgEDiEzKZipal24BbQs50');
        
        let save = JSON.parse(localStorage.getItem('enigma_fix')) || { id: 1, items: [], hp: 3 };

        async function engine(id) {
            save.id = id;
            localStorage.setItem('enigma_fix', JSON.stringify(save));

            const { data: esc } = await sb.from('escenas').select('*').eq('id', id).single();
            const { data: decs } = await sb.from('decisiones').select('*').eq('escena_origen_id', id);

            if(!esc) return;

            document.getElementById('sc-titulo').innerText = esc.titulo_escena;
            document.getElementById('sc-texto').innerText = esc.texto_narrativo;
            
            const ic = document.getElementById('img-cont');
            if(esc.imagen_url) { document.getElementById('sc-img').src = esc.imagen_url; ic.classList.remove('hidden'); }
            else { ic.classList.add('hidden'); }

            const div = document.getElementById('sc-opciones');
            div.innerHTML = '';
            
            decs.forEach(d => {
                const b = document.createElement('button');
                b.className = "w-full p-5 border border-yellow-600/30 rounded-xl text-left hover:bg-yellow-600/10 transition";
                
                // LÓGICA DE BLOQUEO: Solo si le falta un OBJETO FÍSICO
                const faltaItem = d.item_requerido && !save.items.includes(d.item_requerido);
                
                if (faltaItem) {
                    b.innerHTML = `🔒 ${d.texto_boton} (Necesitas ${d.item_requerido})`;
                    b.disabled = true;
                    b.style.opacity = "0.3";
                } else {
                    // Si es un acertijo, ponemos un icono para avisar
                    b.innerHTML = (d.acertijo_respuesta ? "⌨️ " : "") + d.texto_boton;
                    b.onclick = () => {
                        if(d.acertijo_respuesta) {
                            const res = prompt("Escribe el código:");
                            if(!res || res.trim() !== d.acertijo_respuesta) {
                                alert("Incorrecto... el tiempo se agota.");
                                save.hp--; updateUI(); return;
                            }
                        }
                        if(d.item_entregado) save.items.push(d.item_entregado);
                        engine(d.escena_destino_id);
                    };
                }
                div.appendChild(b);
            });
            updateUI();
        }

        function updateUI() {
            document.getElementById('status').innerText = "Valor: " + "❤️".repeat(Math.max(0, save.hp)) + " | Mochila: " + save.items.join(', ');
            if(save.hp <= 0) { alert("Game Over"); localStorage.clear(); location.reload(); }
        }

        window.onload = () => engine(save.id);
    </script>
</body>
</html>
